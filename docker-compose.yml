
services:
  postgres:
    image: postgres:16-alpine
    container_name: urban_mobility_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: urban_mobility_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD:?Defina DOCKER_POSTGRES_PASSWORD no .env}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urban_mobility_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: urban_mobility_airflow:2.10.4
    container_name: urban_mobility_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${DOCKER_POSTGRES_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Defina AIRFLOW_FERNET_KEY no .env}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?Defina AIRFLOW_WEBSERVER_SECRET_KEY no .env}
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Defina AIRFLOW_ADMIN_PASSWORD no .env}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@urbanmobility.com}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: urban_mobility_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
      BRONZE_DIR: /opt/airflow/data/bronze/yellow_taxi
      SILVER_DIR: /opt/airflow/data/silver/yellow_taxi
      SPARK_LOCAL_DIR: /tmp/spark-local
      DBT_EXECUTABLE: /opt/dbt-venv/bin/dbt
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create \
          --username "$$AIRFLOW_ADMIN_USER" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$$AIRFLOW_ADMIN_EMAIL" \
          --password "$$AIRFLOW_ADMIN_PASSWORD" \
          || airflow users list | grep -q "$$AIRFLOW_ADMIN_USER")

  airflow-webserver:
    image: urban_mobility_airflow:2.10.4
    container_name: urban_mobility_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment: *airflow-common-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_data:/opt/airflow/data
      - ./sql:/opt/airflow/sql:ro
      - ./dbt:/opt/airflow/dbt
    command: webserver

  airflow-scheduler:
    image: urban_mobility_airflow:2.10.4
    container_name: urban_mobility_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment: *airflow-common-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - airflow_data:/opt/airflow/data
      - ./sql:/opt/airflow/sql:ro
      - ./dbt:/opt/airflow/dbt
    command: scheduler

volumes:
  pgdata:
  airflow_data:
